# 운영 배포 — Azure Static Web Apps (www.thoysinc.com)
#
# npm run build 가 dist/ 를 만든 뒤 scripts/package-swa.mjs 로 deploy/ 를
# 재배치합니다. Astro 의 base:'/note' 는 링크만 바꾸고 폴더를 중첩하지 않아서
# 이 단계가 필요합니다. 그래서 업로드 대상은 dist 가 아니라 deploy 입니다.
name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 매일 새벽에 한 번 다시 빌드합니다. 게재일이 된 연재 칼럼이
  # 그날 자동으로 공개되게 하려는 것입니다(예약 발행).
  schedule:
    - cron: '0 13 * * *' # 13:00 UTC = 애리조나 06:00 (MST, 서머타임 없음)

permissions:
  contents: read

concurrency:
  group: azure-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: 배포 전 점검 — 원본과 본문이 같은지 대조
        run: node legacy/verify.mjs deploy

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: deploy
          skip_app_build: true
          output_location: ""

      # 위 액션은 실패해도 잡을 초록색으로 끝냅니다. 실제로 두 번 당했습니다 —
      # 배포 토큰이 무효였을 때(2026-08-23), staticwebapp.config.json 에 중복
      # 규칙이 있어 거부됐을 때(2026-09-08). 둘 다 "success" 로 표시됐습니다.
      # 그래서 라이브 사이트를 직접 찔러 확인합니다.
      - name: 배포 확인 — 라이브가 실제로 바뀌었는지
        run: |
          sleep 45
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /tmp/live.html -w '%{http_code}' -m 30 https://www.thoysinc.com/ || true)
            if [ "$code" = "200" ] && grep -q 'Thoys' /tmp/live.html; then
              echo "확인됨: HTTP $code, 첫 화면이 블로그입니다"
              exit 0
            fi
            echo "시도 $i: HTTP $code — 아직 반영 안 됨"
            sleep 20
          done
          echo '배포가 라이브에 반영되지 않았습니다. 위 static-web-apps-deploy 로그를 확인하세요.'
          exit 1
