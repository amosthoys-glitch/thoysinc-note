# GitHub Pages 미리보기 배포.
# 운영은 Azure Static Web Apps(www.thoysinc.com) 이고, 이건 공개 미리보기용입니다.
# 미리보기는 /note 중첩이 필요 없어서 dist 를 그대로 올립니다
# (운영 배포는 scripts/package-swa.mjs 가 옛 /note 주소 리다이렉트를 붙입니다).
name: Pages preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro build
        env:
          SITE_URL: https://amosthoys-glitch.github.io
          SITE_BASE: /thoysinc-note
          PUBLIC_NOINDEX: 'true'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
